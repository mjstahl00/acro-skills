<body>
<div id="app"></div>

<script>
/* ---------- Settings ---------- */
const SUPABASE_URL = "https://mdselnzobyymsekilngj.supabase.co";
const SUPABASE_KEY = "sb_publishable_JhQNcvwj8mbB0v0hDiX3VA_gTTD9tlm"; /* publishable key: safe in the browser */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- State ---------- */
const state = {
  ready: false,        // first session check finished
  session: null,
  name: "",            // instructor display name
  recovery: false,     // arrived from a password-reset email
  busy: false,
  message: null        // { kind: "err" | "ok", text }
};

const app = document.getElementById("app");

/* ---------- Helpers ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function route() {
  const h = (location.hash || "").replace(/^#\/?/, "");
  return h || "home";
}
function go(r) {
  location.hash = "#/" + r;
}
function setMessage(kind, text) {
  state.message = text ? { kind: kind, text: text } : null;
}
function msgHtml() {
  if (!state.message) return "";
  return '<p class="msg ' + state.message.kind + '" role="' + (state.message.kind === "err" ? "alert" : "status") + '">' + esc(state.message.text) + "</p>";
}

const chevron = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>';
const icons = {
  students: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.6a3.5 3.5 0 010 6.8"></path><path d="M18 14.3c2.2.7 3.5 2.6 3.5 5.7"></path></svg>',
  library: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 014 4v13a3 3 0 00-3-3H2z"></path><path d="M22 4h-6a4 4 0 00-4 4v13a3 3 0 013-3h7z"></path></svg>',
  log: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>',
  settings: '<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>'
};
function tile(href, icon, title, sub, primary) {
  return '<a class="tile' + (primary ? " primary" : "") + '" href="#/' + href + '">' +
    '<span class="ico" style="color:' + (primary ? "#FFFFFF" : "#51165F") + '">' + icon + "</span>" +
    '<span class="txt"><span class="t1">' + esc(title) + '</span><span class="t2">' + esc(sub) + "</span></span>" +
    '<span style="color:' + (primary ? "#FFFFFF" : "#51165F") + '">' + chevron + "</span></a>";
}

/* ---------- Views ---------- */
function loginView() {
  return '<main class="screen">' +
    '<img class="logo" src="logo.png" alt="Christine\'s Cirque du Sadism" width="300" height="300" style="width:300px;height:300px;max-width:80vw;max-height:80vw">' +
    '<form id="loginForm" novalidate>' +
    msgHtml() +
    '<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com"></div>' +
    '<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>' +
    '<button class="btn" type="submit"' + (state.busy ? " disabled" : "") + ">Sign in</button>" +
    '<button class="link" type="button" id="forgot">Forgot password?</button>' +
    "</form>" +
    '<p class="foot">Instructor access only</p>' +
    "</main>";

function recoveryView() {
  return '<main class="screen">' +
    '<img class="logo" src="logo.png" alt="Christine\'s Cirque du Sadism" width="220" height="220" style="width:220px;height:220px">' +
    '<form id="recoveryForm" novalidate>' +
    '<h1 style="margin:0;font-size:22px">Choose a new password</h1>' +
    msgHtml() +
    '<div class="field"><label for="newpw">New password</label><input id="newpw" type="password" autocomplete="new-password"></div>' +
    '<button class="btn" type="submit"' + (state.busy ? " disabled" : "") + ">Save password</button>" +
    "</form></main>";
}

function homeView() {
  const who = state.name ? "Signed in as " + esc(state.name) : (state.session ? "Signed in" : "");
  return '<main class="screen">' +
    '<img class="logo" src="logo.png" alt="Christine\'s Cirque du Sadism" width="250" height="250" style="width:250px;height:250px;max-width:70vw;max-height:70vw">' +
    '<nav class="tiles" aria-label="Main">' +
    tile("students", icons.students, "Students", "Grade skills and manage lists", true) +
    tile("library", icons.library, "Skills Library", "Templates and every skill", false) +
    tile("log", icons.log, "Log", "Every graded skill, by date", false) +
    tile("settings", icons.settings, "Settings", "Apparatus list", false) +
    "</nav>" +
    '<p class="who">' + who + "</p>" +
    '<button class="link spacer" type="button" id="signout">Sign out</button>' +
    "</main>";
}

const titles = { students: "Students", library: "Skills Library", log: "Log", settings: "Settings" };
const CATS = ["Basic", "Intermediate", "Advanced", "Expert"];

/* ---------- Data ---------- */
const data = {
  apparatus: [],
  skills: [],          // skills of the chosen apparatus
  loaded: false,
  loadedFor: null
};
const lib = { apparatusId: null, cat: "Basic", level: "All", q: "", retired: false, key: "level", dir: "asc" };

async function loadApparatus() {
  const { data: rows, error } = await sb.from("apparatus").select("id,name").order("name");
  if (error) { setMessage("err", "Could not load apparatus."); return; }
  data.apparatus = rows || [];
  if (!lib.apparatusId || !data.apparatus.some((a) => a.id === lib.apparatusId)) {
    lib.apparatusId = data.apparatus.length ? data.apparatus[0].id : null;
  }
}
async function loadSkills() {
  data.loaded = false;
  const { data: rows, error } = await sb.from("skills").select("*").order("sort_order");
  if (error) { setMessage("err", "Could not load skills."); data.skills = []; }
  else data.skills = rows || [];
  data.loaded = true;
}
function apparatusName(id) {
  const a = data.apparatus.find((x) => x.id === id);
  return a ? a.name : "";
}
function optionsHtml(list, selected) {
  return list.map((o) => '<option value="' + esc(o.value) + '"' + (String(o.value) === String(selected) ? " selected" : "") + ">" + esc(o.label) + "</option>").join("");
}

/* ---------- Skills Library ---------- */
function visibleSkills() {
  const q = lib.q.trim().toLowerCase();
  let rows = data.skills.filter((r) => r.apparatus_id === lib.apparatusId).filter((r) => lib.cat === "All" || r.category === lib.cat)
    .filter((r) => lib.level === "All" || String(r.level) === lib.level)
    .filter((r) => q === "" || r.name.toLowerCase().indexOf(q) !== -1)
    .filter((r) => lib.retired || r.active);
  const dir = lib.dir === "asc" ? 1 : -1;
  const k = lib.key;
  rows.sort((a, b) => {
    if (k === "name") return a.name.localeCompare(b.name) * dir;
    let x = a[k], y = b[k];
    if (typeof x === "boolean") { x = x ? 1 : 0; y = y ? 1 : 0; }
    if (x === y) return (a.sort_order - b.sort_order) || a.name.localeCompare(b.name);
    return (x - y) * dir;
  });
  return rows;
}
function listHtml() {
  if (!data.loaded) return '<p class="hint" aria-busy="true">Loading…</p>';
  const rows = visibleSkills();
  if (!rows.length) {
    return '<p class="card">' + (data.skills.some((x) => x.apparatus_id === lib.apparatusId) ? "No skills match these filters." : "No skills yet for this apparatus. Tap Add skill to create the first one.") + "</p>";
  }
  const cards = rows.map((r) =>
    '<div class="scard"><div class="nm">' + esc(r.name) + '</div>' +
    '<div class="meta">' + esc(r.category) + " · Level " + r.level + " · Order " + r.sort_order + (r.active ? "" : " · Retired") + "</div>" +
    '<div class="bot"><div class="checks2"><label class="chk sm"><input type="checkbox" data-act="tpl" data-id="' + r.id + '"' + (r.in_template ? " checked" : "") + ' aria-label="In template: ' + esc(r.name) + '">In template</label>' +
    '<label class="chk sm"><input type="checkbox" data-act="active" data-id="' + r.id + '"' + (r.active ? " checked" : "") + ' aria-label="Active: ' + esc(r.name) + '">Active</label></div>' +
    '<div class="acts"><a class="rowbtn sm" href="#/skill/' + r.id + '">Edit</a><button class="rowbtn sm" type="button" data-act="copy" data-id="' + r.id + '">Copy</button></div></div></div>').join("");
  const cols = [["sort_order", "Order", 80], ["name", "Name", 0], ["category", "Category", 130], ["level", "Level", 90], ["in_template", "In template", 120], ["active", "Active", 100]];
  const head = cols.map((c) =>
    '<th scope="col" aria-sort="' + (lib.key === c[0] ? (lib.dir === "asc" ? "ascending" : "descending") : "none") + '"' + (c[2] ? ' style="width:' + c[2] + 'px"' : "") + '>' +
    '<button type="button" data-act="sort" data-key="' + c[0] + '"><span>' + c[1] + '</span><span aria-hidden="true" style="font-size:11px">' + (lib.key === c[0] ? (lib.dir === "asc" ? "▲" : "▼") : "") + "</span></button></th>").join("");
  const trs = rows.map((r) =>
    "<tr><td>" + r.sort_order + '</td><td style="font-weight:600">' + esc(r.name) + (r.active ? "" : ' <span class="hint">(retired)</span>') + "</td><td>" + esc(r.category) + "</td><td>" + r.level + "</td>" +
    '<td><input type="checkbox" data-act="tpl" data-id="' + r.id + '"' + (r.in_template ? " checked" : "") + ' aria-label="In template: ' + esc(r.name) + '"></td>' +
    '<td><input type="checkbox" data-act="active" data-id="' + r.id + '"' + (r.active ? " checked" : "") + ' aria-label="Active: ' + esc(r.name) + '"></td>' +
    '<td><div style="display:flex;gap:8px"><a class="rowbtn" href="#/skill/' + r.id + '">Edit</a><button class="rowbtn" type="button" data-act="copy" data-id="' + r.id + '">Copy</button></div></td></tr>').join("");
  return '<div class="cards">' + cards + "</div>" +
    '<div class="tbl"><table><thead><tr>' + head + '<th scope="col" style="width:170px"><span class="plain">Actions</span></th></tr></thead><tbody>' + trs + "</tbody></table></div>" +
    '<p class="hint">Select "In Template" will add that skill to the template for that category which can then be assigned to a student. Retiring a skill hides it without deleting any grades.</p>';
}

function refreshList() {
  const el = document.getElementById("skillList");
  if (el) el.innerHTML = listHtml();
}
function wireLibrary() {
  wireShell();
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("fApp", "change", (e) => { lib.apparatusId = e.target.value; render(); });
  on("fCat", "change", (e) => { lib.cat = e.target.value; refreshList(); });
  on("fLvl", "change", (e) => { lib.level = e.target.value; refreshList(); });
  on("fQ", "input", (e) => { lib.q = e.target.value; refreshList(); });
  on("fRet", "change", (e) => { lib.retired = e.target.checked; refreshList(); });
  const list = document.getElementById("skillList");
  list.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.getAttribute("data-act");
    if (act === "sort") {
      const k = t.getAttribute("data-key");
      if (lib.key === k) lib.dir = lib.dir === "asc" ? "desc" : "asc"; else { lib.key = k; lib.dir = "asc"; }
      refreshList();
    } else if (act === "copy") {
      await copySkill(t.getAttribute("data-id"));
    }
  });
  list.addEventListener("change", async (e) => {
    const t = e.target.closest("[data-act]");
    if (!t || t.type !== "checkbox") return;
    const id = t.getAttribute("data-id");
    const field = t.getAttribute("data-act") === "tpl" ? "in_template" : "active";
    const row = data.skills.find((s) => s.id === id);
    const before = row[field];
    row[field] = t.checked;
    const { error } = await sb.from("skills").update({ [field]: t.checked }).eq("id", id);
    if (error) {
      row[field] = before;
      setMessage("err", "Could not save that change.");
      render();
    } else {
      refreshList();
    }
  });
}
async function copySkill(id) {
  const src = data.skills.find((s) => s.id === id);
  if (!src) return;
  const row = { name: src.name, description: src.description, apparatus_id: src.apparatus_id, category: src.category, level: src.level, sort_order: src.sort_order, active: true, in_template: false };
  const { data: made, error } = await sb.from("skills").insert(row).select().single();
  if (error || !made) { setMessage("err", "Could not copy that skill."); render(); return; }
  data.skills.push(made);
  setMessage("ok", "Copied. Change what you need and save.");
  go("skill/" + made.id);
}

function nextOrder(apparatusId, category, level) {
  const same = data.skills.filter((s) => s.apparatus_id === apparatusId && s.category === category && s.level === Number(level));
  return same.length ? Math.max.apply(null, same.map((s) => s.sort_order || 0)) + 1 : 1;
}

    '<div class="fld"><label class="lbl" for="kLvl">Level</label><select id="kLvl">' + optionsHtml([1, 2, 3].map((n) => ({ value: n, label: String(n) })), v.level) + "</select></div>" +

    '<label class="chk" style="align-items:flex-start"><input id="kAct" type="checkbox"' + (v.active ? " checked" : "") + '><span>Active<small>Untick to retire it. Existing grades are kept.</small></span></label></div>' +
    '<div class="btnrow"><button class="btn2" type="submit" id="kSave">' + (fromStudent && isNew ? "Save and assign to student" : "Save skill") + '</button><a class="btn2 sec" href="#/' + backTo + '">Cancel</a>' + (isNew ? "" : '<button class="btn2 sec webonly" type="button" id="kDel" style="color:#B91C1C;border-color:#B91C1C">Delete skill</button>') + '</div>' + (isNew ? "" : '<p class="hint webonly" style="margin:8px 0 0 0">Delete is for mistakes such as duplicates. It is blocked while any student has a grade for this skill. To keep a skill but hide it, untick Active instead.</p>') + '</form>';
  return shell(fromStudent ? "students" : "library", isNew ? "Add skill" : "Edit skill", fromStudent ? "Adds the skill to the library and to " + ((sdata.students.find((x) => x.id === fromStudent) || {}).name || "this student") + "'s list." : "", backTo, "", body);
}
function wireSkill(idOrNew, fromStudent) {
  wireShell();
  const isNew = idOrNew === "new";
  const sk = isNew ? null : data.skills.find((s) => s.id === idOrNew);
  const form = document.getElementById("skillForm");
  if (!form) return;
  const delBtn = document.getElementById("kDel");
  if (delBtn && sk) delBtn.addEventListener("click", async () => {
    delBtn.disabled = true;
    const lr = await sb.from("skill_log").select("student_id,grade").eq("skill_id", sk.id);
    if (lr.error) { setMessage("err", "Could not check which students have this skill."); render(); return; }
    await loadStudents();
    const graded = (lr.data || []).filter((r) => r.grade);
    if (graded.length) {
      const names = graded.map((r) => { const st = sdata.students.find((x) => x.id === r.student_id); return (st ? st.name : "A student") + " (" + r.grade + ")"; });
      setMessage("err", "Cannot delete " + sk.name + " yet. Graded for: " + names.join(", ") + ". Open each student, remove the skill from their list or clear the grade, then try again.");
      render();
      return;
    }
    const assigned = (lr.data || []).length;
    if (!window.confirm("Delete " + sk.name + " from the library?" + (assigned ? " It will also be taken off " + assigned + " student list" + (assigned === 1 ? "" : "s") + " where it has no grade." : "") + " This cannot be undone.")) { delBtn.disabled = false; return; }
    if (assigned) {
      const d1 = await sb.from("skill_log").delete().eq("skill_id", sk.id);
      if (d1.error) { setMessage("err", "Could not take the skill off student lists: " + d1.error.message); render(); return; }
    }
    const d2 = await sb.from("skills").delete().eq("id", sk.id);
    if (d2.error) { setMessage("err", "Could not delete the skill: " + d2.error.message); render(); return; }
    await loadSkills();
    sdata.loaded = false;
    setMessage("ok", "Deleted " + sk.name + ".");
    go("library");
  });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("kName").value.trim();
    if (!name) { setMessage("err", "Give the skill a name."); render(); return; }
    const row = {
      name: name,
      description: document.getElementById("kDesc").value.trim() || null,
      apparatus_id: document.getElementById("kApp").value,
      category: document.getElementById("kCat").value,
      level: Number(document.getElementById("kLvl").value),
      sort_order: Number(document.getElementById("kOrd").value) || 1,
      in_template: document.getElementById("kTpl").checked,
      active: document.getElementById("kAct").checked
    };
    document.getElementById("kSave").disabled = true;
    const res = isNew ? await sb.from("skills").insert(row).select().single() : await sb.from("skills").update(row).eq("id", sk.id).select().single();
    if (res.error) {
      setMessage("err", "Could not save the skill.");
      render();
      return;
    }
    lib.apparatusId = row.apparatus_id;
    await loadSkills();
    if (isNew && fromStudent && res.data) {
      const lr = await sb.from("skill_log").insert({ student_id: fromStudent, skill_id: res.data.id }).select().single();
      if (lr.error || !lr.data) {
        setMessage("err", "The skill was saved, but it could not be added to the student's list.");
      } else {
        sdata.log.push(lr.data);
        setMessage("ok", row.name + " saved and added to their list.");
      }
      gui.apparatusId = row.apparatus_id;
      gui.tab = "find";
      gui.q = row.name;
      gui.cat = "All";
      gui.lvl = "All";
      go("student/" + fromStudent);
      return;
    }
    setMessage("ok", "Saved.");
    go("library");
  });
}

/* ---------- Students ---------- */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(d) {
  if (!d) return "";
  const p = String(d).slice(0, 10).split("-");
  return MONTHS[Number(p[1]) - 1] + " " + Number(p[2]);
}
function todayStr() {
  const n = new Date();
  return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
}
const sdata = { students: [], log: [], levels: [], instructors: {}, loaded: false };
const sui = { q: "", inactive: false, key: "name", dir: "asc" };
const gui = { apparatusId: null, tab: "mine", q: "", cat: "All", lvl: "All", assignOpen: false, studentId: null, fkey: "category", fdir: "asc" };

async function loadStudents() {
  const a = await sb.from("students").select("*").order("name");
  const b = await sb.from("skill_log").select("*");
  const c = await sb.from("instructors").select("id,name");
  const lv = await sb.from("student_levels").select("*");
  sdata.levels = lv.error ? [] : (lv.data || []);
  if (a.error || b.error) { setMessage("err", "Could not load students."); }
  sdata.students = (a.data || []);
  sdata.log = (b.data || []);
  sdata.instructors = {};
  (c.data || []).forEach((i) => { sdata.instructors[i.id] = i.name; });
  sdata.loaded = true;
}
function levelOf(studentId, apparatusId) {
  const l = sdata.levels.find((x) => x.student_id === studentId && x.apparatus_id === apparatusId);
  return l ? l.category : "";
}
function levelsText(studentId) {
  return data.apparatus.map((a) => { const c = levelOf(studentId, a.id); return c ? a.name + ": " + c : ""; }).filter(Boolean).join(" · ");
}
async function saveLevel(studentId, apparatusId, category) {
  if (!category) return sb.from("student_levels").delete().eq("student_id", studentId).eq("apparatus_id", apparatusId);
  return sb.from("student_levels").upsert({ student_id: studentId, apparatus_id: apparatusId, category: category }, { onConflict: "student_id,apparatus_id" });
}
function studentStats(id) {
  const rows = sdata.log.filter((l) => l.student_id === id);
  const graded = rows.filter((l) => l.grade);
  const last = graded.reduce((m, l) => (l.graded_on && l.graded_on > m ? l.graded_on : m), "");
  return { total: rows.length, graded: graded.length, last: last };
}
function visibleStudents() {
  const q = sui.q.trim().toLowerCase();
  let rows = sdata.students.filter((s) => sui.inactive || s.active).filter((s) => q === "" || s.name.toLowerCase().indexOf(q) !== -1)
    .map((s) => Object.assign({}, s, studentStats(s.id)));
  const dir = sui.dir === "asc" ? 1 : -1;
  rows.sort((a, b) => {
    if (sui.key === "name") return a.name.localeCompare(b.name) * dir;
    let x, y;
    if (sui.key === "level") { x = levelsText(a.id); y = levelsText(b.id); }
    else if (sui.key === "graded") { x = a.graded; y = b.graded; }
    else if (sui.key === "last") { x = a.last || ""; y = b.last || ""; }
    else { x = a.active ? 1 : 0; y = b.active ? 1 : 0; }
    if (x === y) return a.name.localeCompare(b.name);
    return (x > y ? 1 : -1) * dir;
  });
  return rows;
}

function wireGrade(id) {
  wireShell();
  const on = (sel, ev, fn) => { const el = document.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  on("#gApp", "change", (e) => { gui.apparatusId = e.target.value; render(); });
  on("#gQ", "input", (e) => { gui.q = e.target.value; refreshGrade(id); });
  on("#gCat", "change", (e) => { gui.cat = e.target.value; refreshGrade(id); });
  on("#gLvl", "change", (e) => { gui.lvl = e.target.value; refreshGrade(id); });
  document.querySelector(".page").addEventListener("click", async (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.getAttribute("data-act");
    if (act === "tab") { gui.tab = t.getAttribute("data-tab"); render(); }
    else if (act === "fsort") { const k = t.getAttribute("data-key"); if (gui.fkey === k) gui.fdir = gui.fdir === "asc" ? "desc" : "asc"; else { gui.fkey = k; gui.fdir = "asc"; } refreshGrade(id); }
    else if (act === "unassign") {
      const skId = t.getAttribute("data-skill");
      const row = sdata.log.find((l) => l.student_id === id && l.skill_id === skId);
      const sk = skillById(skId);
      const st = sdata.students.find((x) => x.id === id);
      if (!row) return;
      const warn = row.grade ? " It is graded " + row.grade + ", and that grade will be removed too." : "";
      if (!window.confirm("Remove " + (sk ? sk.name : "this skill") + " from " + (st ? st.name : "this student") + "'s list?" + warn)) return;
      t.disabled = true;
      const del = await sb.from("skill_log").delete().eq("id", row.id);
      if (del.error) { setMessage("err", "Could not remove that skill."); render(); return; }
      sdata.log = sdata.log.filter((l) => l.id !== row.id);
      setMessage("ok", "Removed " + (sk ? sk.name : "the skill") + " from their list.");
      render();
    }
    else if (act === "toggleAssign") { gui.assignOpen = !gui.assignOpen; refreshGrade(id); }
    else if (act === "grade") { await setGrade(id, t.getAttribute("data-skill"), t.getAttribute("data-letter")); }
    else if (act === "assign") {
      t.disabled = true;
      const r = await sb.rpc("assign_skills", { p_student_id: id, p_apparatus_id: document.getElementById("tApp").value, p_category: document.getElementById("tCat").value });

        gui.apparatusId = document.getElementById("tApp").value;
        await loadStudents();
      }
      gui.assignOpen = false;
      render();
    }
  });
}
async function setGrade(studentId, skillId, letter) {
  const row = sdata.log.find((l) => l.student_id === studentId && l.skill_id === skillId);
  const uid = state.session.user.id;
  if (row) {
    const clear = row.grade === letter;
    const patch = clear ? { grade: null, graded_on: null, graded_by: null } : { grade: letter, graded_on: todayStr(), graded_by: uid };
    const before = Object.assign({}, row);
    Object.assign(row, patch);
    refreshGrade(studentId);
    const { error } = await sb.from("skill_log").update(patch).eq("id", row.id);
    if (error) { Object.assign(row, before); setMessage("err", "Could not save that grade."); render(); }
  } else {
    const rec = { student_id: studentId, skill_id: skillId, grade: letter, graded_on: todayStr(), graded_by: uid };
    const { data: made, error } = await sb.from("skill_log").insert(rec).select().single();
    if (error || !made) { setMessage("err", "Could not save that grade."); render(); return; }
    sdata.log.push(made);
    refreshGrade(studentId);
  }
}

    const active = document.getElementById("eAct").checked;
    const { error } = await sb.from("students").update({ name: name, active: active }).eq("id", id);
    if (error) { setMessage("err", "Could not save the changes."); render(); return; }
    let levelFail = false;
    for (let i = 0; i < data.apparatus.length; i++) {
      const sel = document.getElementById("lv" + i);
      if (!sel) continue;
      if (sel.value === levelOf(id, sel.getAttribute("data-app"))) continue;
      const r = await saveLevel(id, sel.getAttribute("data-app"), sel.value);
      if (r.error) levelFail = true;
    }
    await loadStudents();
    if (levelFail) { setMessage("err", "Saved, but the level could not be saved. Has the levels SQL been run?"); go("student/" + id); return; }
    setMessage("ok", active ? "Saved." : "Saved. " + name + " is now inactive and hidden from the student list.");
    go(active ? "student/" + id : "students");
  });
}

const imp = { rows: null, file: "", done: "" };
const IMP_COLS = ["name", "description", "apparatus", "category", "level", "sort_order", "in_template"];

function parseCsv(text) {
  text = String(text).replace(/^﻿/, "");
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ""));
}
function skillsCsv(skills) {
  const lines = [IMP_COLS.join(",")];
  skills.forEach((s) => lines.push([s.name, s.description || "", apparatusName(s.apparatus_id), s.category, s.level, s.sort_order || 0, s.in_template ? "yes" : "no"].map(csvEscape).join(",")));
  return "﻿" + lines.join("\r\n");
}
function templateCsv() {
  const ap = data.apparatus.length ? data.apparatus[0].name : "Fabric";
  return "﻿" + IMP_COLS.join(",") + "\r\n" + ["Example skill name", "Optional notes", ap, "Basic", 1, 1, "yes"].map(csvEscape).join(",");
}
function keyOf(appId, name, cat, lvl) { return [appId, String(name).trim().toLowerCase(), cat, String(lvl)].join("|"); }
function analyseImport(table) {
  const head = table[0].map((h) => String(h).trim().toLowerCase().replace(/\s+/g, "_"));
  const idx = {}; IMP_COLS.forEach((c) => { idx[c] = head.indexOf(c); });
  const missing = ["name", "apparatus", "category", "level"].filter((c) => idx[c] === -1);
  if (missing.length) return { error: "The file is missing these column headings: " + missing.join(", ") + ". Use Download blank template to get the right headings." };
  const have = {};
  data.skills.forEach((s) => { have[keyOf(s.apparatus_id, s.name, s.category, s.level)] = true; });
  const next = {};
  data.skills.forEach((s) => { const k = s.apparatus_id + "|" + s.category + "|" + s.level; next[k] = Math.max(next[k] || 0, s.sort_order || 0); });
  const rows = [];
  table.slice(1).forEach((r, n) => {
    const get = (c) => (idx[c] === -1 ? "" : String(r[idx[c]] === undefined ? "" : r[idx[c]]).trim());
    const o = { line: n + 2, name: get("name"), description: get("description"), apparatusText: get("apparatus"), categoryText: get("category"), levelText: get("level"), orderText: get("sort_order"), tplText: get("in_template").toLowerCase(), status: "new", note: "" };
    const app = data.apparatus.find((a) => a.name.toLowerCase() === o.apparatusText.toLowerCase());
    const cat = CATS.find((c) => c.toLowerCase() === o.categoryText.toLowerCase());
    const lvl = /^[123]$/.test(o.levelText) ? Number(o.levelText) : null;
    const problems = [];
    if (!o.name) problems.push("name is blank");
    if (!app) problems.push('apparatus "' + o.apparatusText + '" is not in Settings');
    if (!cat) problems.push('category "' + o.categoryText + '" must be Basic, Intermediate, Advanced or Expert');
    if (!lvl) problems.push('level "' + o.levelText + '" must be 1, 2 or 3');
    if (o.orderText && !/^\d+$/.test(o.orderText)) problems.push("sort_order must be a whole number");
    if (o.tplText && ["yes", "y", "true", "1", "x", "no", "n", "false", "0"].indexOf(o.tplText) === -1) problems.push('in_template "' + o.tplText + '" must be yes or no');
    if (problems.length) { o.status = "bad"; o.note = problems.join("; "); }
    else {
      const k = keyOf(app.id, o.name, cat, lvl);
      if (have[k]) {
        const ex = data.skills.find((x) => keyOf(x.apparatus_id, x.name, x.category, x.level) === k);
        if (ex && !ex.active) { o.status = "retired"; o.note = "Already in the library but retired (not active). Not uploaded. Reactivate it in Skills Library instead."; }
        else { o.status = "exists"; o.note = "Already in the library. Not uploaded."; }
      }
      else {
        have[k] = true;
        const nk = app.id + "|" + cat + "|" + lvl;
        const ord = o.orderText ? Number(o.orderText) : (next[nk] || 0) + 1;
        next[nk] = Math.max(next[nk] || 0, ord);
        o.record = { name: o.name, description: o.description || null, apparatus_id: app.id, category: cat, level: lvl, sort_order: ord, active: true, in_template: ["yes", "y", "true", "1", "x"].indexOf(o.tplText) !== -1 };
      }
    }
    rows.push(o);
  });
  return { rows: rows };
}

  document.getElementById("iDown").addEventListener("click", () => downloadText("skills-" + todayStr() + ".csv", skillsCsv(data.skills)));
  document.getElementById("iUp").addEventListener("click", () => { const f = document.getElementById("iFile"); f.value = ""; f.click(); });
  document.getElementById("iTpl").addEventListener("click", () => downloadText("skills-template.csv", templateCsv()));
  document.getElementById("iFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    imp.done = ""; setMessage(null);
    const table = parseCsv(await f.text());
    if (table.length < 2) { imp.rows = null; document.getElementById("iPrev").innerHTML = '<p class="msg err" role="alert">That file has no skill rows under the heading row.</p>'; return; }
    const res = analyseImport(table);
    if (res.error) { imp.rows = null; document.getElementById("iPrev").innerHTML = '<p class="msg err" role="alert">' + esc(res.error) + "</p>"; return; }
    imp.rows = res.rows; imp.file = f.name; prev();
  });
  wirePrev();
}

/* ---------- Stub for screens not built yet ---------- */
function stubView(r) {
  return shell(r, titles[r] || "Not found", "", "home", "", '<div class="card">This screen is coming next.</div>');
}

/* ---------- Render ---------- */
async function render() {
  if (!state.ready) {
    app.innerHTML = '<main class="screen" aria-busy="true"></main>';
    return;
  }
  if (state.recovery) {
    app.innerHTML = recoveryView();
    wireRecovery();
    return;
  }
  if (!state.session) {
    app.innerHTML = loginView();
    wireLogin();
    return;
  }
  const r = route();
  const parts = r.split("/");
  const token = ++renderToken;
  const known = ["library", "skill", "settings", "students", "student", "log", "import"];
  if (r === "home" || known.indexOf(parts[0]) === -1) {
    app.innerHTML = homeView();
    document.getElementById("signout").addEventListener("click", signOut);
    return;
  }
  {
    if (!data.apparatus.length) { await loadApparatus(); }
    if (token !== renderToken) return;
    if (!data.loaded) { await loadSkills(); if (token !== renderToken) return; }
    if (parts[0] === "students" || parts[0] === "student" || parts[0] === "log" || (parts[0] === "skill" && parts[2])) {
      if (!sdata.loaded || parts[0] === "students" || (parts[1] && !sdata.students.some((x) => x.id === parts[1]) && parts[1] !== "new")) {
        await loadStudents();
        if (token !== renderToken) return;
      }
    }
  }
  if (parts[0] === "library") {
    app.innerHTML = libraryView();
    wireLibrary();
  } else if (parts[0] === "skill") {
    app.innerHTML = skillView(parts[1] || "new", parts[2]);
    wireSkill(parts[1] || "new", parts[2]);
  } else if (parts[0] === "import") {
    imp.rows = imp.rows && imp.file ? imp.rows : null;
    app.innerHTML = importView();
    wireImport();
  } else if (parts[0] === "settings") {
    app.innerHTML = settingsView();
    wireSettings();
  } else if (parts[0] === "log") {
    app.innerHTML = logView();
    wireLog();
  } else if (parts[0] === "students") {
    app.innerHTML = studentsView();
    wireStudents();
  } else if (parts[0] === "student" && parts[2] === "edit") {
    app.innerHTML = editStudentView(parts[1]);
    wireEditStudent(parts[1]);
  } else if (parts[0] === "student" && parts[1] === "new") {
    app.innerHTML = addStudentView();
    wireAddStudent();
  } else if (parts[0] === "student") {
    app.innerHTML = gradeView(parts[1]);
    wireGrade(parts[1]);
  } else {
    app.innerHTML = stubView(parts[0]);
    wireShell();
  }
  state.message = null;
}
let renderToken = 0;

/* ---------- Actions ---------- */
function wireLogin() {
  const form = document.getElementById("loginForm");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      setMessage("err", "Enter your email and password.");
      render();
      return;
    }
    state.busy = true;
    setMessage(null);
    render();
    const { error } = await sb.auth.signInWithPassword({ email: email, password: password });
    state.busy = false;
    if (error) {
      setMessage("err", "That email and password did not work.");
      render();
      const f = document.getElementById("email");
      if (f) f.value = email;
    }
    /* On success onAuthStateChange takes over. */
  });
  document.getElementById("forgot").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      setMessage("err", "Type your email first, then tap Forgot password.");
      render();
      return;
    }
    const redirectTo = location.origin + location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    setMessage(error ? "err" : "ok", error ? "Could not send the reset email. Try again in a minute." : "If that email has an account, a reset link is on its way.");
    render();
    const f = document.getElementById("email");
    if (f) f.value = email;
  });
}

function wireRecovery() {
  document.getElementById("recoveryForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("newpw").value;
    if (pw.length < 8) {
      setMessage("err", "Use at least 8 characters.");
      render();
      return;
    }
    state.busy = true;
    render();
    const { error } = await sb.auth.updateUser({ password: pw });
    state.busy = false;
    if (error) {
      setMessage("err", "Could not save the new password. Try the reset link again.");
    } else {
      state.recovery = false;
      setMessage("ok", "");
      setMessage(null);
      go("home");
    }
    render();
  });
}

async function signOut() {
  await sb.auth.signOut();
  state.name = "";
  data.apparatus = [];
  data.skills = [];
  data.loaded = false;
  lib.apparatusId = null;
  sdata.loaded = false;
  sdata.students = [];
  sdata.log = [];
  setMessage(null);
  go("home");
}

async function loadName() {
  state.name = "";
  if (!state.session) return;
  const { data } = await sb.from("instructors").select("name").eq("id", state.session.user.id).maybeSingle();
  state.name = data && data.name ? data.name : "";
}

/* ---------- Start ---------- */
sb.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  if (event === "PASSWORD_RECOVERY") state.recovery = true;
  if (session) {
    setMessage(null);
    /* Do not call Supabase inside this callback directly; defer it. */
    setTimeout(async () => { await loadName(); render(); }, 0);
  } else {
    state.name = "";
  }
  state.ready = true;
  render();
});

window.addEventListener("hashchange", render);
render();
</script>
