<script>
/* Read before Supabase clears the link: did this visit come from an invite email? */
const INVITE_AT_LOAD = /type=invite/.test(location.hash + location.search);
/* ---------- Settings ---------- */
const SUPABASE_URL = "https://mdselnzobyymsekilngj.supabase.co";
const SUPABASE_KEY = "sb_publishable_JhQNcvwj8mbB0v0hDiX3VA_gTTD9tlm"; /* publishable key: safe in the browser */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- State ---------- */
const state = {
  ready: false,        // first session check finished
  session: null,
  name: "",            // instructor display name
  recovery: false,     // arrived from a password-reset email
  busy: false,
  message: null        // { kind: "err" | "ok", text }
};

const app = document.getElementById("app");

/* ---------- Helpers ---------- */
function confirmDialog(title, text, okLabel, typeWord) {
  return new Promise((resolve) => {
    const prevFocus = document.activeElement;
    const ov = document.createElement("div");
    ov.className = "cfov";
    ov.innerHTML = '<div class="cfbox" role="alertdialog" aria-modal="true" aria-labelledby="cfT" aria-describedby="cfD"><h2 id="cfT">' + esc(title) + '</h2><p id="cfD">' + esc(text) + "</p>" + (typeWord ? '<div class="fld" style="margin:0 0 16px 0;display:flex;flex-direction:column;gap:6px"><label class="lbl" for="cfType" style="font-size:13px;font-weight:600;color:var(--muted)">Type ' + esc(typeWord) + ' to confirm</label><input id="cfType" type="text" autocomplete="off" style="height:48px;border:1.5px solid var(--field);border-radius:12px;padding:0 12px;font-size:16px;color:var(--text);background:#FFFFFF;width:100%;box-sizing:border-box"></div>' : "") + '<div class="cfbtns"><button type="button" class="btn2 sec" id="cfNo">Cancel</button><button type="button" class="btn2 danger" id="cfOk">' + esc(okLabel || "OK") + "</button></div></div>";
    const done = (v) => { document.removeEventListener("keydown", key); ov.remove(); if (prevFocus && prevFocus.focus) { try { prevFocus.focus(); } catch (e) {} } resolve(v); };
    const key = (e) => {
      if (e.key === "Escape") done(false);
      else if (e.key === "Tab") { const b = [ov.querySelector("#cfNo"), ov.querySelector("#cfOk")]; const i = b.indexOf(document.activeElement); e.preventDefault(); b[(i + (e.shiftKey ? -1 : 1) + 2) % 2].focus(); }
    };
    document.addEventListener("keydown", key);
    ov.addEventListener("click", (e) => { if (e.target === ov) done(false); });
    document.body.appendChild(ov);
    ov.querySelector("#cfNo").addEventListener("click", () => done(false));
    ov.querySelector("#cfOk").addEventListener("click", () => done(true));
    if (typeWord) {
      const ok = ov.querySelector("#cfOk"), inp = ov.querySelector("#cfType");
      ok.disabled = true;
      inp.addEventListener("input", () => { ok.disabled = inp.value.trim().toLowerCase() !== typeWord.toLowerCase(); });
      inp.addEventListener("keydown", (e) => { if (e.key === "Tab") e.stopPropagation(); });
    }
    ov.querySelector("#cfNo").focus();
  });
}
function replaceDialog(title, text, options) {
  return new Promise((resolve) => {
    const prevFocus = document.activeElement;
    const ov = document.createElement("div");
    ov.className = "cfov";
    ov.innerHTML = '<div class="cfbox" role="alertdialog" aria-modal="true" aria-labelledby="cfT" aria-describedby="cfD"><h2 id="cfT">' + esc(title) + '</h2><p id="cfD">' + esc(text) + '</p><div style="margin:0 0 16px 0"><label for="rpSel" style="display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">Replace with</label><select id="rpSel" style="width:100%;height:48px;border:1.5px solid var(--field);border-radius:12px;padding:0 12px;font-size:16px;background:#FFFFFF"><option value="">Choose a skill…</option>' + options.map((o) => '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>").join("") + '</select></div><div class="cfbtns"><button type="button" class="btn2 sec" id="cfNo">Cancel</button><button type="button" class="btn2 danger" id="cfOk" disabled>Move grades and delete</button></div></div>';
    const done = (v) => { document.removeEventListener("keydown", key); ov.remove(); if (prevFocus && prevFocus.focus) { try { prevFocus.focus(); } catch (e) {} } resolve(v); };
    const key = (e) => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", key);
    ov.addEventListener("click", (e) => { if (e.target === ov) done(null); });
    document.body.appendChild(ov);
    const sel = ov.querySelector("#rpSel"), ok = ov.querySelector("#cfOk");
    sel.addEventListener("change", () => { ok.disabled = !sel.value; });
    ov.querySelector("#cfNo").addEventListener("click", () => done(null));
    ok.addEventListener("click", () => done(sel.value));
    sel.focus();
  });
}
async function moveGrades(fromSkill, toSkillId) {
  /* Moves every student's record from one skill to another. If a student already has the target skill, the newer grade wins. */
  const fr = await sb.from("skill_log").select("*").eq("skill_id", fromSkill.id);
  if (fr.error) return { error: fr.error.message };
  const tr = await sb.from("skill_log").select("*").eq("skill_id", toSkillId);
  if (tr.error) return { error: tr.error.message };
  const targetBy = {};
  (tr.data || []).forEach((r) => { targetBy[r.student_id] = r; });
  let moved = 0, kept = 0;
  for (const r of fr.data || []) {
    const t = targetBy[r.student_id];
    if (!t) {
      if (r.grade) {
        const ins = await sb.from("skill_log").insert({ student_id: r.student_id, skill_id: toSkillId, grade: r.grade, graded_on: r.graded_on, graded_by: r.graded_by });
        if (ins.error) return { error: ins.error.message, moved: moved };
        moved++;
      } else {
        const ins = await sb.from("skill_log").insert({ student_id: r.student_id, skill_id: toSkillId, grade: null, graded_on: null, graded_by: null });
        if (ins.error) return { error: ins.error.message, moved: moved };
      }
    } else if (r.grade && (!t.grade || String(r.graded_on || "") > String(t.graded_on || ""))) {
      const up = await sb.from("skill_log").update({ grade: r.grade, graded_on: r.graded_on, graded_by: r.graded_by }).eq("id", t.id);
      if (up.error) return { error: up.error.message, moved: moved };
      moved++;
    } else if (r.grade) {
      kept++;
    }
    const del = await sb.from("skill_log").delete().eq("id", r.id);
    if (del.error) return { error: del.error.message, moved: moved };
  }
  return { moved: moved, kept: kept };
}

function visibleSkills() {
  const q = lib.q.trim().toLowerCase();
  let rows = data.skills.filter((r) => lib.apparatusId === "All" || r.apparatus_id === lib.apparatusId).filter((r) => lib.cat === "All" || r.category === lib.cat)
    .filter((r) => lib.level === "All" || String(r.level) === lib.level)
    .filter((r) => q === "" || r.name.toLowerCase().indexOf(q) !== -1)
    .filter((r) => lib.retired || r.active);
  const dir = lib.dir === "asc" ? 1 : -1;
  const k = lib.key;
  rows.sort((a, b) => {
    if (k === "default") return (appName(a.apparatus_id).localeCompare(appName(b.apparatus_id))) || (CATS.indexOf(a.category) - CATS.indexOf(b.category)) || (a.level - b.level) || (a.sort_order - b.sort_order) || a.name.localeCompare(b.name);
    if (k === "category") return ((CATS.indexOf(a.category) - CATS.indexOf(b.category)) || (a.level - b.level) || (a.sort_order - b.sort_order)) * dir;
    if (k === "name") return a.name.localeCompare(b.name) * dir;
    if (k === "apparatus") return (appName(a.apparatus_id).localeCompare(appName(b.apparatus_id)) || (a.sort_order - b.sort_order)) * dir;
    let x = a[k], y = b[k];
    if (typeof x === "boolean") { x = x ? 1 : 0; y = y ? 1 : 0; }
    if (x === y) return (a.sort_order - b.sort_order) || a.name.localeCompare(b.name);
    return (x - y) * dir;

}

    delBtn.disabled = true;
    const lr = await sb.from("skill_log").select("student_id,grade").eq("skill_id", sk.id);
    if (lr.error) { setMessage("err", "Could not check which students have this skill."); render(); return; }
    await loadStudents();
    const graded = (lr.data || []).filter((r) => r.grade);
    if (graded.length) {
      const names = graded.map((r) => { const st = sdata.students.find((x) => x.id === r.student_id); return (st ? st.name : "A student") + " (" + r.grade + ")"; });
      const others = data.skills.filter((x) => x.id !== sk.id && x.apparatus_id === sk.apparatus_id && x.active)
        .sort((x, y) => x.name.localeCompare(y.name)).map((x) => ({ value: x.id, label: x.name + " · " + x.category + " · Level " + x.level }));
      if (!others.length) { setMessage("err", "Cannot delete " + sk.name + " yet. It is graded for: " + names.join(", ") + ". Clear or reassign grades before deleting the skill."); render(); return; }
      const pick = await replaceDialog("Replace this skill?", sk.name + " is graded for: " + names.join(", ") + ". Choose the skill that replaces it. Their grades move to that skill (if a student already has a grade there, the newer one is kept), then " + sk.name + " is deleted. This cannot be undone.", others);
      if (!pick) { delBtn.disabled = false; return; }
      const mv = await moveGrades(sk, pick);
      if (mv.error) { setMessage("err", "Could not move the grades: " + mv.error + (mv.moved ? " (" + mv.moved + " already moved; run it again to finish)" : "")); render(); return; }
      const d3 = await sb.from("skills").delete().eq("id", sk.id);
      if (d3.error) { setMessage("err", "Grades were moved but the skill could not be deleted: " + d3.error.message); render(); return; }
      const tn = (data.skills.find((x) => x.id === pick) || {}).name || "the other skill";
      await loadSkills();
      sdata.loaded = false;
      setMessage("ok", "Moved " + mv.moved + " grade" + (mv.moved === 1 ? "" : "s") + " to " + tn + (mv.kept ? " (kept " + mv.kept + " newer grade" + (mv.kept === 1 ? "" : "s") + " already there)" : "") + " and deleted " + sk.name + ".");
      go("library");
      return;
    }
    const assigned = (lr.data || []).length;
    if (!(await confirmDialog("Delete this skill?", sk.name + " will be deleted from the library." + (assigned ? " It will also be taken off " + assigned + " student list" + (assigned === 1 ? "" : "s") + " where it has no grade." : "") + " This cannot be undone.", "Delete skill"))) { delBtn.disabled = false; return; }
    if (assigned) {
      const d1 = await sb.from("skill_log").delete().eq("skill_id", sk.id);
      if (d1.error) { setMessage("err", "Could not take the skill off student lists: " + d1.error.message); render(); return; }
    }
    const d2 = await sb.from("skills").delete().eq("id", sk.id);
    if (d2.error) { setMessage("err", "Could not delete the skill: " + d2.error.message); render(); return; }
    await loadSkills();
    sdata.loaded = false;
    setMessage("ok", "Deleted " + sk.name + ".");
    go("library");
  });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("kName").value.trim();
    if (!name) { setMessage("err", "Give the skill a name."); render(); return; }
    const row = {
      name: name,
      description: document.getElementById("kDesc").value.trim() || null,
      apparatus_id: document.getElementById("kApp").value,
      category: document.getElementById("kCat").value,
      level: Number(document.getElementById("kLvl").value),
      sort_order: Number(document.getElementById("kOrd").value) || 1,
      in_template: document.getElementById("kTpl").checked,
      active: document.getElementById("kAct").checked
    };
    document.getElementById("kSave").disabled = true;
    const res = isNew ? await sb.from("skills").insert(row).select().single() : await sb.from("skills").update(row).eq("id", sk.id).select().single();
    if (res.error) {
      setMessage("err", "Could not save the skill.");
      render();
      return;
    }
    if (lib.apparatusId !== "All") lib.apparatusId = row.apparatus_id;
    await loadSkills();
    if (isNew && fromStudent && res.data) {
      const lr = await sb.from("skill_log").insert({ student_id: fromStudent, skill_id: res.data.id }).select().single();
      if (lr.error || !lr.data) {
        setMessage("err", "The skill was saved, but it could not be added to the student's list.");
      } else {
        sdata.log.push(lr.data);
        setMessage("ok", row.name + " saved and added to their list.");
      }
      if (gui.apparatusId !== "All") gui.apparatusId = row.apparatus_id;
      gui.tab = "find";
      gui.q = row.name;
      gui.cat = "All";
      gui.lvl = "All";
      go("student/" + fromStudent);
      return;
    }
    setMessage("ok", "Saved.");
    go("library");
  });
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(d) {
  if (!d) return "";
  const p = String(d).slice(0, 10).split("-");
  return MONTHS[Number(p[1]) - 1] + " " + Number(p[2]);
}
function todayStr() {
  const n = new Date();
  return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
}
const sdata = { students: [], log: [], levels: [], instructors: {}, loaded: false };
const sui = { q: "", inactive: false, key: "name", dir: "asc" };
const gui = { apparatusId: "All", tab: "mine", q: "", cat: "All", lvl: "All", assignOpen: false, hideExtra: false, studentId: null, fkey: "category", fdir: "asc" };

async function loadStudents() {
  const a = await fetchAll("students", ["name", "id"]);
  const b = await fetchAll("skill_log", ["id"]);
  const c = await sb.from("instructors").select("id,name");
  const lv = await sb.from("student_levels").select("*");
  sdata.levels = lv.error ? [] : (lv.data || []);
  if (a.error || b.error) { setMessage("err", "Could not load students."); }
  sdata.students = a.rows;
  sdata.log = b.rows;
  sdata.instructors = {};
  (c.data || []).forEach((i) => { sdata.instructors[i.id] = i.name; });
  sdata.loaded = true;
}
function levelOf(studentId, apparatusId) {
  const l = sdata.levels.find((x) => x.student_id === studentId && x.apparatus_id === apparatusId);
  return l ? l.category : "";
}
function levelsText(studentId) {
  return data.apparatus.map((a) => { const c = levelOf(studentId, a.id); return c ? a.name + ": " + c : ""; }).filter(Boolean).join(" · ");
}
async function saveLevel(studentId, apparatusId, category) {
  if (!category) return sb.from("student_levels").delete().eq("student_id", studentId).eq("apparatus_id", apparatusId);
  return sb.from("student_levels").upsert({ student_id: studentId, apparatus_id: apparatusId, category: category }, { onConflict: "student_id,apparatus_id" });
}
function studentStats(id) {
  const rows = sdata.log.filter((l) => l.student_id === id);
  const graded = rows.filter((l) => l.grade);
  const last = graded.reduce((m, l) => (l.graded_on && l.graded_on > m ? l.graded_on : m), "");
  return { total: rows.length, graded: graded.length, last: last };
}
function visibleStudents() {
  const q = sui.q.trim().toLowerCase();
  let rows = sdata.students.filter((s) => sui.inactive || s.active).filter((s) => q === "" || s.name.toLowerCase().indexOf(q) !== -1)
    .map((s) => Object.assign({}, s, studentStats(s.id)));
  const dir = sui.dir === "asc" ? 1 : -1;
  rows.sort((a, b) => {
    if (sui.key === "name") return a.name.localeCompare(b.name) * dir;
    let x, y;
    if (sui.key === "level") { x = levelsText(a.id); y = levelsText(b.id); }
    else if (sui.key === "graded") { x = a.graded; y = b.graded; }
    else if (sui.key === "last") { x = a.last || ""; y = b.last || ""; }
    else { x = a.active ? 1 : 0; y = b.active ? 1 : 0; }
    if (x === y) return a.name.localeCompare(b.name);
    return (x > y ? 1 : -1) * dir;
  });
  return rows;
}
function studentListHtml() {
  const rows = visibleStudents();
  if (!rows.length) return '<p class="card">' + (sdata.students.length ? "No students match." : "No students yet. Tap Add student to create the first one.") + "</p>";

    '<a class="scard" style="text-decoration:none;color:inherit" href="#/student/' + s.id + '"><div class="nm">' + esc(s.name) + (s.active ? "" : ' <span class="hint">(inactive)</span>') + "</div>" +
    '<div class="meta">' + (levelsText(s.id) ? esc(levelsText(s.id)) + " · " : "") + (s.total ? s.graded + " of " + s.total + " graded" + (s.last ? " · last graded " + fmtDate(s.last) : "") : "Not started") + "</div></a>").join("");
  const cols = [["name", "Name"], ["level", "Current level"], ["graded", "Skills graded"], ["last", "Last graded"], ["active", "Status"]];

  const trs = rows.map((s) =>

  return '<div class="cards">' + cards + '</div><div class="tbl"><table style="min-width:700px"><thead><tr>' + head + "</tr></thead><tbody>" + trs + "</tbody></table></div>";
}

async function setGrade(studentId, skillId, letter) {
  const row = sdata.log.find((l) => l.student_id === studentId && l.skill_id === skillId);
  const uid = state.session.user.id;
  if (row) {
    const clear = row.grade === letter;
    const patch = clear ? { grade: null, graded_on: null, graded_by: null } : { grade: letter, graded_on: todayStr(), graded_by: uid };
    const before = Object.assign({}, row);
    Object.assign(row, patch);
    refreshGrade(studentId);
    const { error } = await sb.from("skill_log").update(patch).eq("id", row.id);
    if (error) { Object.assign(row, before); setMessage("err", "Could not save that grade."); render(); }
  } else {
    const rec = { student_id: studentId, skill_id: skillId, grade: letter, graded_on: todayStr(), graded_by: uid };
    const { data: made, error } = await sb.from("skill_log").insert(rec).select().single();
    if (error || !made) { setMessage("err", "Could not save that grade."); render(); return; }
    sdata.log.push(made);
    refreshGrade(studentId);
  }
}

const lui = { sel: [], app: "All", cat: "All", lvl: "All", type: "All", grade: "All", by: "All", slevel: "All", q: "", ungraded: false, pages: true, pickerOpen: false, key: "", dir: "asc" };

function gradeChip(g) {
  if (!g) return '<span class="hint" style="white-space:nowrap;flex:none">not graded</span>';
  const pal = { A: ["#DCFCE7", "#15803D", "#14532D"], B: ["#FEF3C7", "#B45309", "#713F12"], C: ["#FEE2E2", "#B91C1C", "#7F1D1D"] }[g];

}
function logRows() {
  const q = lui.q.trim().toLowerCase();
  const out = [];
  sdata.log.forEach((l) => {
    const st = sdata.students.find((x) => x.id === l.student_id);
    const sk = skillById(l.skill_id);
    if (!st || !sk || !st.active) return;
    if (!l.grade && !lui.ungraded) return;
    if (lui.sel.length && lui.sel.indexOf(st.id) === -1) return;
    if (lui.app !== "All" && sk.apparatus_id !== lui.app) return;
    if (lui.cat !== "All" && sk.category !== lui.cat) return;
    if (lui.lvl !== "All" && String(sk.level) !== lui.lvl) return;
    if (lui.type === "Template" && !sk.in_template) return;
    if (lui.type === "Extra" && sk.in_template) return;
    if (lui.grade === "None" ? !!l.grade : (lui.grade !== "All" && l.grade !== lui.grade)) return;
    if (lui.by !== "All" && l.graded_by !== lui.by) return;
    const slv = levelOf(st.id, sk.apparatus_id);
    if (lui.slevel !== "All" && slv !== lui.slevel) return;
    if (q && sk.name.toLowerCase().indexOf(q) === -1) return;
    out.push({ student_id: st.id, student: st.name, slevel: slv, apparatus: apparatusName(sk.apparatus_id), category: sk.category, level: sk.level, tpl: sk.in_template ? "Template" : "Extra", retired: !sk.active, sk: sk, desc: sk.description || "", order: sk.sort_order || 0, skill: sk.name, grade: l.grade || "", day: l.graded_on ? String(l.graded_on).slice(0, 10) : "", by: l.graded_by ? (sdata.instructors[l.graded_by] || "") : "" });
  });
  out.sort((a, b) => a.student.localeCompare(b.student) || a.apparatus.localeCompare(b.apparatus) || (CATS.indexOf(a.category) - CATS.indexOf(b.category)) || (a.level - b.level) || ((a.tpl === "Template" ? 0 : 1) - (b.tpl === "Template" ? 0 : 1)) || (a.order - b.order) || a.skill.localeCompare(b.skill));
  return out;
}

/* ---------- Backup ---------- */
async function fetchAll(table, orderCols) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(table).select("*");
    orderCols.forEach((c) => { q = q.order(c); });
    const r = await q.range(from, from + 999);
    if (r.error) return { error: r.error, rows: out };
    out.push.apply(out, r.data || []);
    if (!r.data || r.data.length < 1000) break;
  }
  return { rows: out };
}
const BACKUP_TABLES = [

  { name: "skills", cols: ["id", "name", "description", "apparatus_id", "category", "level", "sort_order", "active", "in_template"], order: ["id"], conflict: "id" },
  { name: "students", cols: ["id", "name", "active"], order: ["id"], conflict: "id" },
  { name: "student_levels", cols: ["student_id", "apparatus_id", "category"], order: ["student_id", "apparatus_id"], conflict: "student_id, apparatus_id", optional: true },
  { name: "instructors", cols: ["id", "name"], order: ["id"], conflict: "id", optional: true },
  { name: "skill_log", cols: ["id", "student_id", "skill_id", "grade", "graded_on", "graded_by"], order: ["id"], conflict: "id" },
  { name: "skill_log_history", cols: ["id", "student_id", "skill_id", "grade", "previous_grade", "changed_at", "changed_by"], order: ["id"], conflict: "id", optional: true }

function sqlVal(v) {
  if (v === null || v === undefined) return "null";

  if (typeof v === "number") return String(v);

}
function buildSql(tables, stamp) {
  const L = ["-- Student Skills Tracker backup", "-- Made " + stamp, "-- To restore: open Supabase > SQL Editor > New query, paste this whole file, press Run.", "-- It only adds rows that are missing. It does not change or delete rows that already exist.", ""];
  BACKUP_TABLES.forEach((t) => {
    const rows = tables[t.name] || [];
    L.push("-- " + t.name + " (" + rows.length + " rows)");
    for (let i = 0; i < rows.length; i += 200) {
      const chunk = rows.slice(i, i + 200).map((r) => "(" + t.cols.map((c) => sqlVal(r[c])).join(", ") + ")").join(",\n  ");
      const stmt = "insert into public." + t.name + " (" + t.cols.join(", ") + ") values\n  " + chunk + "\non conflict (" + t.conflict + ") do nothing;";
      if (t.name === "instructors") L.push("do $$ begin\n" + stmt + "\nexception when others then raise notice 'Instructor rows were not restored: %', sqlerrm;\nend $$;");

}

    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ""));
}
function skillsCsv(skills) {
  const lines = [IMP_COLS.join(",")];
  skills.forEach((s) => lines.push([s.name, s.description || "", apparatusName(s.apparatus_id), s.category, s.level, s.sort_order || 0, s.in_template ? "yes" : "no"].map(csvEscape).join(",")));
  return bomIf(lines.join("\r\n"));
}
function templateCsv() {
  return bomIf(IMP_COLS.join(",") + "\r\n");
}
function keyOf(appId, name, cat, lvl) { return [appId, String(name).trim().toLowerCase(), cat, String(lvl)].join("|"); }
function analyseImport(table) {
  const head = table[0].map((h) => String(h).trim().toLowerCase().replace(/\s+/g, "_"));
  const idx = {}; IMP_COLS.forEach((c) => { idx[c] = head.indexOf(c); });
  const missing = ["name", "apparatus", "category", "level"].filter((c) => idx[c] === -1);
  if (missing.length) return { error: "The file is missing these column headings: " + missing.join(", ") + ". Use Download Blank Upload Template to get the right headings." };
  const have = {};
  data.skills.forEach((s) => { have[keyOf(s.apparatus_id, s.name, s.category, s.level)] = true; });
  const next = {};
  data.skills.forEach((s) => { const k = s.apparatus_id + "|" + s.category + "|" + s.level; next[k] = Math.max(next[k] || 0, s.sort_order || 0); });
  const rows = [];
  table.slice(1).forEach((r, n) => {
    const get = (c) => (idx[c] === -1 ? "" : String(r[idx[c]] === undefined ? "" : r[idx[c]]).trim());
    const o = { line: n + 2, name: get("name"), description: get("description").replace(/\r\n?/g, "\n"), apparatusText: get("apparatus"), categoryText: get("category"), levelText: get("level"), orderText: get("sort_order"), tplText: get("in_template").toLowerCase(), status: "new", note: "" };
    const app = data.apparatus.find((a) => a.name.toLowerCase() === o.apparatusText.toLowerCase());
    const cat = CATS.find((c) => c.toLowerCase() === o.categoryText.toLowerCase());
    const lvl = /^[123]$/.test(o.levelText) ? Number(o.levelText) : null;
    const problems = [];
    if (!o.name) problems.push("name is blank");
    if (!app) problems.push('apparatus "' + o.apparatusText + '" is not in Settings');
    if (!cat) problems.push('category "' + o.categoryText + '" must be Basic, Intermediate, Advanced or Expert');
    if (!lvl) problems.push('level "' + o.levelText + '" must be 1, 2 or 3');
    if (o.orderText && !/^\d+$/.test(o.orderText)) problems.push("sort_order must be a whole number");
    if (o.tplText && ["yes", "y", "true", "1", "x", "no", "n", "false", "0"].indexOf(o.tplText) === -1) problems.push('in_template "' + o.tplText + '" must be yes or no');
    if (problems.length) { o.status = "bad"; o.note = problems.join("; "); }
    else {
      const k = keyOf(app.id, o.name, cat, lvl);
      if (have[k]) {
        const ex = data.skills.find((x) => keyOf(x.apparatus_id, x.name, x.category, x.level) === k);
        if (ex && !ex.active) { o.status = "retired"; o.note = "Already in the library but retired (not active). Not uploaded. Reactivate it in Skills Library instead."; }
        else { o.status = "exists"; o.note = "Already in the library. Not uploaded."; }
      }
      else {
        have[k] = true;
        const nk = app.id + "|" + cat + "|" + lvl;
        const ord = o.orderText ? Number(o.orderText) : (next[nk] || 0) + 1;
        next[nk] = Math.max(next[nk] || 0, ord);
        o.record = { name: o.name, description: o.description || null, apparatus_id: app.id, category: cat, level: lvl, sort_order: ord, active: true, in_template: ["yes", "y", "true", "1", "x"].indexOf(o.tplText) !== -1 };
      }
    }
    rows.push(o);
  });
  return { rows: rows };
}
function importPreviewHtml() {
  if (imp.done) return '<p class="msg ok" role="status">' + esc(imp.done) + "</p>";
  if (!imp.rows) return "";
  const c = { new: 0, exists: 0, retired: 0, bad: 0 }; imp.rows.forEach((r) => { c[r.status]++; });
  const label = { new: "Will add", exists: "Not uploaded", retired: "Retired", bad: "Problem" };
  const color = { new: "#15803D", exists: "#5E5566", retired: "#B45309", bad: "#B91C1C" };
  const td = "padding:8px 12px;vertical-align:top;border-bottom:1px solid #EEE6F2;";
  const th = "padding:8px 12px;text-align:left;font-size:13px;color:var(--deep);background:var(--soft);";
  const trs = imp.rows.map((r) => '<tr><td style="' + td + '">' + r.line + '</td><td style="' + td + "font-weight:700;white-space:nowrap;color:" + color[r.status] + '">' + label[r.status] + '</td><td style="' + td + '">' + esc(r.name) + '</td><td style="' + td + 'white-space:nowrap">' + esc(r.apparatusText) + " · " + esc(r.categoryText) + " · " + esc(r.levelText) + '</td><td style="' + td + '">' + esc(r.note) + "</td></tr>").join("");
  const parts = [c.new + " to add"];
  if (c.exists) parts.push(c.exists + " already in the library");
  if (c.retired) parts.push(c.retired + " already in the library but retired");
  if (c.bad) parts.push(c.bad + " with problems");
  return '<section class="card" style="padding:16px"><h2 style="margin:0 0 6px 0;color:var(--deep)">Preview of ' + esc(imp.file) + "</h2><p>" + parts.join(", ") + ". Only the ones marked <b>Will add</b> are uploaded, and nothing is saved until you press the button.</p>" +
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:560px"><thead><tr><th scope="col" style="' + th + '">Row</th><th scope="col" style="' + th + '">Result</th><th scope="col" style="' + th + '">Skill</th><th scope="col" style="' + th + '">Apparatus · category · level</th><th scope="col" style="' + th + '">Note</th></tr></thead><tbody>' + trs + "</tbody></table></div>" +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn2" type="button" id="iGo"' + (c.new ? "" : " disabled") + ">Add " + c.new + " new skill" + (c.new === 1 ? "" : "s") + '</button><button class="btn2 sec" type="button" id="iCancel">Cancel</button></div></section>';
}
function importView() {
  const apps = data.apparatus.map((a) => a.name).join(", ") || "none yet";
  const body = '<section class="card"><h2 style="margin:0 0 8px 0;color:var(--deep)">How to upload skills from a file</h2><ol style="margin:0;padding-left:22px;line-height:1.6">' +
    "<li>Press <b>Download All Skills</b>. It opens in Excel or Google Sheets and lists every skill in the library (active and inactive).</li>" +
    "<li>Use that list to determine if a skill is in the library. You can then delete the rows you don't need and keep the top header row, or press <b>Download Blank Upload Template</b> for a clean file.</li>" +
    "<li>Add the new skills as new rows below the top header row.<br><b>Apparatus</b> options are " + esc(apps) + ".<br><b>Category</b> options are " + CATS.slice(0, -1).join(", ") + " or " + CATS[CATS.length - 1] + ".<br><b>Level</b> options are 1, 2 or 3.<br><b>In template</b> must be yes or no.</li>" +
    "<li>Save as CSV, press <b>Upload New Skills</b>, select file, check the preview, then press the add button. Skills already in the library are skipped, so the system will not duplicate skills within reason.</li></ol>" +
    '<p class="hint" style="margin:10px 0 0 0">The text entered in the Apparatus, Category, In template and Skill name fields is not case sensitive.</p></section>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0"><button class="btn2 sec" type="button" id="iDown">Download All Skills</button><button class="btn2 sec" type="button" id="iTpl">Download Blank Upload Template</button><button class="btn2" type="button" id="iUp">Upload New Skills</button><input id="iFile" type="file" accept=".csv,text/csv" hidden></div>' +
    '<div id="iPrev">' + importPreviewHtml() + "</div>";
  return shell("library", "Upload / Download Skills", "", "library", "", body);
}
function wireImport() {
  wireShell();
  const prev = () => { document.getElementById("iPrev").innerHTML = importPreviewHtml(); wirePrev(); };
  const wirePrev = () => {
    const go = document.getElementById("iGo"), cn = document.getElementById("iCancel");
    if (cn) cn.addEventListener("click", () => { imp.rows = null; imp.file = ""; document.getElementById("iFile").value = ""; prev(); });
    if (go) go.addEventListener("click", async () => {
      go.disabled = true; go.textContent = "Adding…";
      const recs = imp.rows.filter((r) => r.status === "new").map((r) => r.record);
      const { error } = await sb.from("skills").insert(recs);
      if (error) { setMessage("err", "Could not add the skills: " + error.message); imp.rows = null; imp.file = ""; render(); return; }
      await loadSkills();
      imp.done = "Added " + recs.length + " skill" + (recs.length === 1 ? "" : "s") + " to the library."; imp.rows = null; imp.file = "";
      render();
    });
  };
  document.getElementById("iDown").addEventListener("click", () => downloadText("skills-" + todayStr() + ".csv", skillsCsv(data.skills)));
  document.getElementById("iUp").addEventListener("click", () => { const f = document.getElementById("iFile"); f.value = ""; f.click(); });
  document.getElementById("iTpl").addEventListener("click", () => downloadText("skills-template.csv", templateCsv()));
  document.getElementById("iFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    imp.done = ""; setMessage(null);
    const table = parseCsv(await f.text());
    if (table.length < 2) { imp.rows = null; document.getElementById("iPrev").innerHTML = '<p class="msg err" role="alert">That file has no skill rows under the heading row.</p>'; return; }
    const res = analyseImport(table);
    if (res.error) { imp.rows = null; document.getElementById("iPrev").innerHTML = '<p class="msg err" role="alert">' + esc(res.error) + "</p>"; return; }
    imp.rows = res.rows; imp.file = f.name; prev();
  });
  wirePrev();
}

/* ---------- Stub for screens not built yet ---------- */
function stubView(r) {
  return shell(r, titles[r] || "Not found", "", "home", "", '<div class="card">This screen is coming next.</div>');
}

/* ---------- Render ---------- */
async function render() {
  if (!state.ready) {
    app.innerHTML = '<main class="screen" aria-busy="true"></main>';
    return;
  }
  if (state.recovery) {
    app.innerHTML = recoveryView();
    wireRecovery();
    return;
  }
  if (!state.session) {
    app.innerHTML = loginView();
    wireLogin();
    return;
  }
  const r = route();
  const parts = r.split("/");
  const token = ++renderToken;
  const known = ["library", "skill", "settings", "students", "student", "log", "import"];
  if (!(parts[0] === "skill" && parts[1] === "new" && !parts[2])) copyDraft = null;
  if (r === "home" || known.indexOf(parts[0]) === -1) {
    app.innerHTML = homeView();
    document.getElementById("signout").addEventListener("click", signOut);
    return;
  }
  {
    if (!data.apparatus.length) { await loadApparatus(); }
    if (token !== renderToken) return;
    if (!data.loaded) { await loadSkills(); if (token !== renderToken) return; }
    if (parts[0] === "students" || parts[0] === "student" || parts[0] === "log" || (parts[0] === "skill" && parts[2])) {
      if (!sdata.loaded || parts[0] === "students" || (parts[1] && !sdata.students.some((x) => x.id === parts[1]) && parts[1] !== "new")) {
        await loadStudents();
        if (token !== renderToken) return;
      }
    }
  }
  if (parts[0] === "library") {
    app.innerHTML = libraryView();
    wireLibrary();
  } else if (parts[0] === "skill") {
    app.innerHTML = skillView(parts[1] || "new", parts[2]);
    wireSkill(parts[1] || "new", parts[2]);
  } else if (parts[0] === "import") {
    imp.rows = imp.rows && imp.file ? imp.rows : null;
    app.innerHTML = importView();
    wireImport();
  } else if (parts[0] === "settings") {
    app.innerHTML = settingsView();
    wireSettings();
  } else if (parts[0] === "log") {
    app.innerHTML = logView();
    wireLog();
  } else if (parts[0] === "students") {
    app.innerHTML = studentsView();
    wireStudents();
  } else if (parts[0] === "student" && parts[2] === "edit") {
    app.innerHTML = editStudentView(parts[1]);
    wireEditStudent(parts[1]);
  } else if (parts[0] === "student" && parts[1] === "new") {
    app.innerHTML = addStudentView();
    wireAddStudent();
  } else if (parts[0] === "student" && parts[2] === "history") {
    await loadHistory(parts[1]);
    if (token !== renderToken) return;
    app.innerHTML = historyView(parts[1]);
    wireHistory(parts[1]);
  } else if (parts[0] === "student") {
    app.innerHTML = gradeView(parts[1]);
    wireGrade(parts[1]);
  } else {
    app.innerHTML = stubView(parts[0]);
    wireShell();
  }
  state.message = null;
}
let renderToken = 0;

/* ---------- Actions ---------- */
function wireLogin() {
  const form = document.getElementById("loginForm");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      setMessage("err", "Enter your email and password.");
      render();
      return;
    }
    state.busy = true;
    setMessage(null);
    render();
    const { error } = await sb.auth.signInWithPassword({ email: email, password: password });
    state.busy = false;
    if (error) {
      setMessage("err", "That email and password did not work.");
      render();
      const f = document.getElementById("email");
      if (f) f.value = email;
    }
    /* On success onAuthStateChange takes over. */
  });
  document.getElementById("forgot").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      setMessage("err", "Type your email first, then tap Forgot password.");
      render();
      return;
    }
    const redirectTo = location.origin + location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    setMessage(error ? "err" : "ok", error ? "Could not send the reset email. Try again in a minute." : "If that email has an account, a reset link is on its way.");
    render();
    const f = document.getElementById("email");
    if (f) f.value = email;
  });
}

function wireRecovery() {
  document.getElementById("recoveryForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("newpw").value;
    if (pw.length < 8) {
      setMessage("err", "Use at least 8 characters.");
      render();
      return;
    }
    state.busy = true;
    render();
    const { error } = await sb.auth.updateUser({ password: pw });
    state.busy = false;
    if (error) {
      setMessage("err", "Could not save the new password. Try the reset link again.");
    } else {
      state.recovery = false;
      setMessage("ok", "");
      setMessage(null);
      go("home");
    }
    render();
  });
}

async function signOut() {
  await sb.auth.signOut();
  state.name = "";
  data.apparatus = [];
  data.skills = [];
  data.loaded = false;
  lib.apparatusId = "All";
  sdata.loaded = false;
  sdata.students = [];
  sdata.log = [];
  setMessage(null);
  go("home");
}

async function loadName() {
  state.name = "";
  if (!state.session) return;
  const { data } = await sb.from("instructors").select("name").eq("id", state.session.user.id).maybeSingle();
  state.name = data && data.name ? data.name : "";
}

let arrivedByInvite = INVITE_AT_LOAD;
/* ---------- Start ---------- */
sb.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  if (event === "PASSWORD_RECOVERY") state.recovery = true;
  /* An invite link signs the person in without a password, so send them to the set-password screen first. */
  if (arrivedByInvite && session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) { state.recovery = true; arrivedByInvite = false; }
  if (session) {
    setMessage(null);
    /* Do not call Supabase inside this callback directly; defer it. */
    setTimeout(async () => { await loadName(); render(); }, 0);
  } else {
    state.name = "";
  }
  state.ready = true;
  render();
});

window.addEventListener("hashchange", render);
render();
</script>
